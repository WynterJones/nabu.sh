# Publishes cross-compiled binaries to GitHub Releases when a version tag is
# pushed. The daemon is CGo-free, so one Linux runner builds every target.
#
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser reads the tag history to build the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Vet
        run: go vet ./...

      # The full suite already ran against this exact commit when it landed on
      # main, so re-running it here only adds a second chance to hit a flaky
      # test and block a release that is otherwise fine. Requiring the recorded
      # CI result instead is a stronger gate: it cannot be defeated by a retry,
      # and it refuses a tag placed on a commit that was never checked.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed" \
            --jq '[.workflow_runs[].conclusion] | first // "none"')
          echo "CI for $GITHUB_SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to publish. CI has not passed for this commit."
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
