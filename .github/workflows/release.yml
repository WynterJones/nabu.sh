# Publishes cross-compiled binaries to GitHub Releases when a version tag is
# pushed. The daemon is CGo-free, so one Linux runner builds every target.
#
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser reads the tag history to build the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Fail before publishing rather than shipping a broken release.
      - name: Verify
        run: |
          go vet ./...
          go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
